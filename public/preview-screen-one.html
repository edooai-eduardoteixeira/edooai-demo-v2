<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Screen 1 — Landing Page</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --color-black: #000000;
      --color-white: #ffffff;
      --color-gray-100: #f5f5f5;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-tertiary: #94a3b8;
      --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --radius-md: 10px;
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --transition-base: 200ms ease;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-family);
      background: var(--color-white);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    .header {
      padding: 20px 48px;
      border-bottom: 1px solid var(--color-gray-100);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 18px;
      color: var(--color-black);
      letter-spacing: -0.02em;
    }

    /* ── Hero wrapper: fills remaining space, centers content ── */
    .hero-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 48px;
    }

    /* ── Hero content: constrained width ── */
    .hero {
      text-align: center;
      max-width: 960px;
      width: 100%;
    }

    .hero h1 {
      font-size: 48px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.08;
      letter-spacing: -0.03em;
      max-width: 792px;
      margin: 0 auto 48px;
    }

    .hero .subtitle {
      font-size: 22px;
      font-weight: 500;
      color: var(--text-secondary);
      line-height: 1.5;
      margin-bottom: 56px;
    }

    /* ── CTA Button ── */
    .cta-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 32px;
      font-size: 17px;
      font-weight: 600;
      border-radius: var(--radius-md);
      border: none;
      background-color: var(--color-black);
      color: var(--color-white);
      cursor: pointer;
      transition: all var(--transition-base);
      line-height: 1.4;
      letter-spacing: -0.01em;
    }

    .cta-button:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }

    /* ── Footer ── */
    .footer {
      padding: 24px 48px;
      text-align: center;
    }

    .footer p {
      font-size: 15px;
      font-weight: 400;
      color: var(--text-tertiary);
      line-height: 1.5;
    }

    /* ── Mobile ── */
    @media (max-width: 600px) {
      .header { padding: 16px 20px; }
      .hero-wrapper { padding: 0 20px; }
      .hero h1 { font-size: 39px; margin-bottom: 40px; }
      .hero .subtitle { font-size: 18px; margin-bottom: 48px; }
      .cta-button {
        font-size: 14px;
        padding: 12px 28px;
      }
      .footer { padding: 20px; }
      .footer p { font-size: 12px; }
    }
  </style>
</head>
<body>
  <div class="page">

    <header class="header">
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <rect width="28" height="28" rx="6" fill="black" />
          <text x="14" y="19" text-anchor="middle" fill="white" font-size="14" font-weight="700" font-family="Inter, sans-serif">E</text>
        </svg>
        Edoo AI
      </div>
    </header>

    <section class="hero-wrapper">
      <main class="hero">
        <h1>Turn your best customers<br>into your growth engine.</h1>
        <p class="subtitle">Stop competing for expensive ads while your most powerful channel is untapped. We operate your referrals end-to-end to deliver active customers at a fraction of your CAC.</p>
        <button class="cta-button">Start Now</button>
      </main>
    </section>

    <footer class="footer">
      <p>On a mission to scale distribution for the best products on earth.</p>
    </footer>

  </div>
</body>
</html>
