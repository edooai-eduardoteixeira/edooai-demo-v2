<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Screen 1 — Landing Page</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --color-black: #000000;
      --color-white: #ffffff;
      --color-gray-50: #fafafa;
      --color-gray-100: #f5f5f5;
      --color-gray-300: #d4d4d4;
      --color-gray-500: #737373;
      --color-gray-600: #525252;
      --color-gray-700: #404040;
      --color-gray-900: #171717;

      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-tertiary: #94a3b8;
      --border: #e2e8f0;
      --border-light: #f1f5f9;
      --bg: #ffffff;
      --surface: #ffffff;
      --accent: #1a1a1a;
      --accent-hover: #000000;
      --accent-subtle: #fafafa;

      --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

      --radius-md: 10px;
      --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.04);
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --transition-base: 200ms ease;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-family);
      background: var(--bg);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── Header ── */
    .header {
      padding: 24px 48px;
      border-bottom: 1px solid var(--color-gray-100);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 18px;
      color: var(--color-black);
      letter-spacing: -0.02em;
    }

    /* ── Hero ── */
    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 68px 48px;
      max-width: 792px;
      margin: 0 auto;
      text-align: center;
    }

    .hero h1 {
      font-size: 48px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.08;
      letter-spacing: -0.03em;
      margin-bottom: 40px;
    }

    .hero .subtitle {
      font-size: 22px;
      font-weight: 400;
      color: var(--text-secondary);
      line-height: 1.7;
      margin-bottom: 48px;
      max-width: 600px;
    }

    /* ── CTA Button ── */
    .cta-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 32px;
      font-size: 17px;
      font-weight: 600;
      border-radius: var(--radius-md);
      border: none;
      background-color: var(--color-black);
      color: var(--color-white);
      cursor: pointer;
      transition: all var(--transition-base);
      line-height: 1.4;
      letter-spacing: -0.01em;
    }

    .cta-button:hover {
      background-color: var(--accent-hover);
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }

    /* ── Footer ── */
    .footer {
      padding: 32px 48px;
      text-align: center;
    }

    .footer p {
      font-size: 15px;
      font-weight: 400;
      color: var(--text-tertiary);
      letter-spacing: 0;
      line-height: 1.5;
    }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .header {
        padding: 20px 24px;
      }
      .hero {
        padding: 48px 24px;
      }
      .hero h1 {
        font-size: 28px;
      }
      .hero .subtitle {
        font-size: 16px;
      }
      .footer {
        padding: 24px;
      }
    }
  </style>
</head>
<body>
  <div style="min-height: 100vh; display: flex; flex-direction: column;">

    <!-- Header -->
    <header class="header">
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <rect width="28" height="28" rx="6" fill="black" />
          <text x="14" y="19" text-anchor="middle" fill="white" font-size="14" font-weight="700" font-family="Inter, sans-serif">E</text>
        </svg>
        Edoo AI
      </div>
    </header>

    <!-- Hero -->
    <main class="hero">
      <h1>Turn your best customers into your distribution leverage.</h1>
      <p class="subtitle">Stop overpaying for ads. Edoo AI runs your referral strategy autonomously to deliver new active customers at a fraction of the cost. Zero manual effort.</p>
      <button class="cta-button">Start Now</button>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <p>On a mission to scale distribution for the best products on earth.</p>
    </footer>

  </div>
</body>
</html>
