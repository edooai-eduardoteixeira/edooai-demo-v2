<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edoo AI — Data Connection v7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --color-black: #000000;
  --color-white: #ffffff;
  --color-gray-50: #fafafa;
  --color-gray-100: #f5f5f5;
  --color-gray-200: #e5e5e5;
  --color-gray-300: #d4d4d4;
  --color-gray-400: #a3a3a3;
  --color-gray-500: #737373;
  --color-gray-600: #525252;
  --color-gray-700: #404040;
  --color-gray-800: #262626;
  --color-gray-900: #171717;
  --color-green-50: #f0fdf4;
  --color-green-100: #dcfce7;
  --color-green-500: #22c55e;
  --color-green-600: #16a34a;
  --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-size-xs: 0.75rem;
  --font-size-sm: 0.875rem;
  --font-size-base: 1rem;
  --font-size-lg: 1.125rem;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-full: 9999px;
  --shadow-xs: 0 1px 2px rgba(0,0,0,0.04);
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -2px rgba(0,0,0,0.05);
  --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08), 0 4px 6px -4px rgba(0,0,0,0.06);
  --shadow-xl: 0 20px 25px -5px rgba(0,0,0,0.08), 0 8px 10px -6px rgba(0,0,0,0.04);
  --shadow-glow: 0 0 0 3px rgba(0,0,0,0.08);
  --text-primary: #0f172a;
  --text-secondary: #475569;
  --text-tertiary: #94a3b8;
  --border: #e2e8f0;
  --border-light: #f1f5f9;
  --bg: #ffffff;
  --surface: #ffffff;
  --accent: #1a1a1a;
  --accent-hover: #000000;
  --accent-light: #f5f5f5;
  --accent-subtle: #fafafa;
  --success: #10b981;
  --danger: #ef4444;
  --warn: #f59e0b;
  --transition-fast: 150ms ease;
  --transition-base: 200ms ease;
  --transition-slow: 300ms ease;
}
html { font-size: 16px; -webkit-font-smoothing: antialiased; }
body { font-family: var(--font-family); color: var(--color-gray-900); background: var(--color-white); line-height: 1.6; }
button { cursor: pointer; border: none; background: none; font-family: inherit; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeInSimple { from { opacity: 0; } to { opacity: 1; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
@keyframes scaleIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
@keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
@keyframes slideInRight { from { opacity: 0; transform: translateX(12px); } to { opacity: 1; transform: translateX(0); } }
@keyframes checkPop { 0% { transform: scale(0); } 60% { transform: scale(1.2); } 100% { transform: scale(1); } }
@keyframes modalSlide { from { opacity: 0; transform: translateY(-16px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes pulseDot { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
/* ─── Layout ─── */
.app { min-height: 100vh; display: flex; flex-direction: column; }
header { padding: 1.5rem 3rem; border-bottom: 1px solid var(--border-light); }
.logo { display: flex; align-items: center; gap: 0.5rem; font-weight: 700; font-size: 1.125rem; color: var(--color-black); letter-spacing: -0.02em; }
/* ─── Split screen (sidebar nav + content) ─── */
.split-container { flex: 1; display: grid; grid-template-columns: 280px 1fr; min-height: 0; max-width: 1100px; margin: 0 auto; width: 100%; }
.left-col { display: flex; flex-direction: column; padding: 2rem 1.25rem 4rem 2rem; overflow-y: auto; overflow-x: hidden; border-right: 1px solid var(--border-light); }
.right-col { padding: 2rem 3rem 4rem; overflow-y: auto; }
.right-col.animate-in { animation: slideUp 0.3s ease; }
/* ─── Sidebar nav items ─── */
.nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--radius-sm); cursor: pointer; transition: all var(--transition-fast); margin-bottom: 2px; border-left: 3px solid transparent; }
.nav-item:hover { background: var(--color-gray-50); }
.nav-item.active { background: var(--color-gray-50); border-left-color: var(--color-black); }
.nav-item-title { font-size: 14px; font-weight: 500; color: var(--text-secondary); }
.nav-item.active .nav-item-title { font-weight: 600; color: var(--text-primary); }
.nav-item-check { margin-left: auto; color: var(--color-green-500); flex-shrink: 0; }
.nav-section-label { font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-tertiary); padding: 16px 12px 6px; }
/* ─── AI Prompt Card ─── */
.prompt-card { width: 100%; }
.prompt-card.animate { animation: slideUp 0.4s ease; }
.prompt-question { font-size: 32px; font-weight: 600; color: var(--text-primary); line-height: 1.3; margin-bottom: 8px; letter-spacing: -0.02em; }
.prompt-sub { font-size: var(--font-size-lg); color: var(--text-secondary); font-weight: 400; margin-bottom: 32px; line-height: 1.5; }
/* ─── Platform row: connected state ─── */
.platform-row.connected { display: flex; width: 100%; cursor: default; opacity: 1; grid-column: 1 / -1; flex-wrap: wrap; padding: 12px 0; }
.platform-row.connected:hover { opacity: 1; }
.platform-row-status { display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; color: var(--color-green-600); margin-left: auto; }
.platform-row-status.pending { color: var(--warn); }
.platform-row-status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--color-green-500); flex-shrink: 0; }
.platform-row-status.pending .platform-row-status-dot { background: var(--warn); }
.platform-row-disconnect { color: var(--text-tertiary); cursor: pointer; opacity: 0; transition: all var(--transition-fast); flex-shrink: 0; }
.platform-row.connected:hover .platform-row-disconnect { opacity: 1; }
.platform-row-disconnect:hover { color: var(--danger); }
.platform-row-scopes { width: 100%; padding-left: 30px; font-size: 12px; color: var(--text-tertiary); line-height: 1.4; }
.platform-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
.platform-row { display: inline-flex; align-items: center; gap: 8px; padding: 12px 0; cursor: pointer; width: fit-content; transition: opacity 0.15s ease; }
.platform-row:hover { opacity: 0.55; }
.platform-row:active { opacity: 0.4; }
.platform-row-icon { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.platform-row-name { font-size: 15px; font-weight: 600; color: var(--text-primary); }
.platform-row-chevron { color: var(--color-gray-300); flex-shrink: 0; }
.group-label { font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-tertiary); margin-bottom: 6px; }
.group-label:not(:first-of-type) { margin-top: 28px; }
.skip-btn { display: inline-flex; align-items: center; gap: 6px; margin-top: 20px; padding: 0.875rem 2rem; font-size: var(--font-size-base); font-weight: 600; color: var(--color-black); background: var(--color-white); border: 1px solid var(--color-gray-300); border-radius: var(--radius-md); cursor: pointer; transition: all var(--transition-base); line-height: 1.4; }
.skip-btn:hover { background: var(--color-gray-50); }
/* ─── Custom integration cards (Tier 2 technical paths) ─── */
.custom-integration-group { margin-top: 8px; display: flex; flex-direction: column; gap: 8px; }
.custom-card { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border: 1px solid var(--border); border-radius: var(--radius-md); cursor: pointer; transition: all var(--transition-fast); background: var(--color-white); }
.custom-card:hover { border-color: var(--color-gray-400); background: var(--color-gray-50); }
.custom-card:active { background: var(--color-gray-100); }
.custom-card-icon { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.custom-card-content { flex: 1; min-width: 0; }
.custom-card-name { font-size: 14px; font-weight: 600; color: var(--text-primary); line-height: 1.3; }
.custom-card-desc { font-size: 12.5px; color: var(--text-tertiary); line-height: 1.4; margin-top: 2px; }
.custom-card-chevron { color: var(--color-gray-300); flex-shrink: 0; }
.custom-card-badge { display: inline-flex; align-items: center; margin-left: 8px; padding: 1px 8px; font-size: 11px; font-weight: 600; color: var(--color-green-600); background: var(--color-green-50); border-radius: var(--radius-full); letter-spacing: 0.01em; vertical-align: middle; }
/* ─── Agentic Builder (modal bottom section) ─── */
.agentic-divider { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
.agentic-header { font-size: 13px; font-weight: 600; color: var(--text-primary); margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
.agentic-header .sparkle { color: var(--warn); }
.agentic-sub { font-size: 12px; color: var(--text-tertiary); margin-bottom: 12px; line-height: 1.4; }
.agentic-textarea { width: 100%; min-height: 80px; padding: 10px 12px; font-size: 13px; font-family: 'SF Mono', 'Fira Code', Menlo, Consolas, monospace; color: var(--text-primary); background: var(--color-gray-50); border: 1px solid var(--border); border-radius: var(--radius-sm); resize: vertical; line-height: 1.5; transition: border-color var(--transition-fast); }
.agentic-textarea:focus { outline: none; border-color: var(--color-gray-400); }
.agentic-textarea::placeholder { color: var(--text-tertiary); font-family: var(--font-family); font-style: normal; font-size: 12.5px; }
.agentic-generate-btn { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; padding: 8px 16px; font-size: 13px; font-weight: 600; color: var(--color-black); background: var(--color-white); border: 1px solid var(--color-gray-300); border-radius: var(--radius-sm); cursor: pointer; transition: all var(--transition-fast); }
.agentic-generate-btn:hover { background: var(--color-gray-50); border-color: var(--color-gray-400); }
.agentic-section-box { background: var(--color-gray-50); border-radius: var(--radius-md); padding: 16px; margin-top: 4px; }
.agentic-generate-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.agentic-output { width: 100%; margin-top: 12px; padding: 14px 16px; font-size: 12px; font-family: 'SF Mono', 'Fira Code', Menlo, Consolas, monospace; color: #e2e8f0; background: #1e293b; border-radius: var(--radius-sm); overflow-x: auto; line-height: 1.6; white-space: pre; animation: fadeIn 0.3s ease; }
/* ─── Exit CTA (appears inside right-col after takeover) ─── */
.exit-cta { margin-top: 32px; opacity: 0; transform: translateY(8px); transition: opacity 0.4s ease, transform 0.4s ease; }
.exit-cta.visible { opacity: 1; transform: translateY(0); }
.cta-btn { display: inline-flex; align-items: center; justify-content: center; padding: 0.875rem 2rem; font-size: var(--font-size-base); font-weight: 600; border-radius: var(--radius-md); background: var(--color-black); color: var(--color-white); border: none; cursor: pointer; transition: all var(--transition-base); line-height: 1.4; }
.cta-btn:hover { background: var(--color-gray-800); }
/* ─── Ledger ─── */
@keyframes arriveFromCenter {
  0% { opacity: 0; transform: translateX(-80px) scale(0.92); }
  60% { opacity: 1; transform: translateX(4px) scale(1.01); }
  100% { opacity: 1; transform: translateX(0) scale(1); }
}
@keyframes highlightFade {
  0% { background-color: var(--color-green-50); }
  100% { background-color: transparent; }
}
.ledger-section-title { font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-tertiary); margin-bottom: 12px; }
.ledger-card { padding: 14px 0; border-bottom: 1px solid var(--border-light); position: relative; }
.ledger-card.just-landed { animation: arriveFromCenter 0.5s cubic-bezier(0.22, 1, 0.36, 1), highlightFade 1.5s ease 0.4s both; border-radius: var(--radius-sm); }
.ledger-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.ledger-platform-name { font-size: var(--font-size-sm); font-weight: 600; color: var(--text-primary); }
.ledger-status { display: flex; align-items: center; gap: 5px; margin-left: auto; font-size: 11px; font-weight: 600; color: var(--success); }
.ledger-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); animation: pulseDot 2s ease infinite; }
.ledger-scopes { padding-left: 28px; margin-top: 4px; }
.ledger-scope-item { font-size: 12.5px; color: var(--text-secondary); line-height: 1.5; padding: 2px 0; }
.ledger-kebab { position: relative; margin-left: 8px; opacity: 0; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-sm); cursor: pointer; transition: opacity var(--transition-fast); }
.ledger-card:hover .ledger-kebab { opacity: 1; }
.ledger-kebab:hover { background: var(--color-gray-200); }
.ledger-dropdown { position: absolute; top: 100%; right: 0; margin-top: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); box-shadow: var(--shadow-md); padding: 4px 0; z-index: 10; min-width: 130px; animation: fadeInSimple 0.1s ease; }
.ledger-dropdown-item { display: flex; align-items: center; gap: 6px; width: 100%; padding: 8px 12px; font-size: 12.5px; font-weight: 500; color: var(--danger); cursor: pointer; transition: background var(--transition-fast); }
.ledger-dropdown-item:hover { background: #fef2f2; }
.ledger-empty { font-size: var(--font-size-sm); color: var(--text-tertiary); padding: 8px 0; }
/* ─── Modal overlay ─── */
.modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.25); z-index: 100; display: flex; align-items: center; justify-content: center; animation: fadeInSimple 0.2s ease; }
.modal-card { background: var(--surface); border-radius: var(--radius-lg); padding: 32px; max-width: 440px; width: calc(100% - 32px); box-shadow: var(--shadow-lg); animation: modalSlide 0.25s ease; position: relative; }
.modal-card.modal-card-wide { max-width: 680px; }
.modal-title { font-size: 1.125rem; font-weight: 600; color: var(--text-primary); margin-bottom: 16px; }
.modal-scopes { list-style: none; margin-bottom: 20px; }
.modal-scopes li { display: flex; align-items: flex-start; gap: 8px; padding: 8px 0; font-size: var(--font-size-sm); color: var(--text-secondary); line-height: 1.4; }
.modal-scopes li + li { border-top: 1px solid var(--border-light); }
.scope-icon { width: 18px; height: 18px; border-radius: 50%; background: var(--color-green-50); display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }
.modal-footer { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text-tertiary); padding-top: 16px; border-top: 1px solid var(--border-light); }
.modal-close { position: absolute; top: 16px; right: 16px; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-sm); cursor: pointer; color: var(--text-tertiary); transition: all var(--transition-fast); }
.modal-close:hover { background: var(--accent-subtle); color: var(--text-primary); }
.modal-connect-btn { width: 100%; padding: 12px; font-size: var(--font-size-base); font-weight: 600; border-radius: var(--radius-md); border: none; cursor: pointer; transition: all var(--transition-base); margin-top: 16px; }
.modal-connect-btn.primary { background: var(--color-black); color: var(--color-white); }
.modal-connect-btn.primary:hover { background: var(--color-gray-800); }
/* ─── Modal field elements ─── */
.modal-field-label { font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-tertiary); margin-bottom: 8px; }
.modal-field-box { display: flex; align-items: center; gap: 8px; background: var(--color-gray-50); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; }
.modal-field-code { flex: 1; font-size: 13px; color: var(--text-primary); font-family: 'SF Mono', 'Fira Code', 'Fira Mono', Menlo, Consolas, monospace; word-break: break-all; line-height: 1.4; }
.modal-copy-btn { flex-shrink: 0; padding: 4px 10px; font-size: 11px; font-weight: 600; color: var(--text-secondary); background: var(--color-white); border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; transition: all var(--transition-fast); }
.modal-copy-btn:hover { background: var(--color-gray-100); color: var(--text-primary); }
/* ─── Ledger pending status ─── */
.ledger-status.pending { color: var(--warn); }
.ledger-dot.pending { background: var(--warn); }
/* ─── Validation states ─── */
.validation-card { width: 100%; max-width: 480px; background: var(--surface); border-radius: var(--radius-lg); padding: 32px; text-align: center; animation: slideUp 0.3s ease; }
.spinner { width: 32px; height: 32px; border: 3px solid var(--color-gray-200); border-top-color: var(--color-gray-700); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 16px; }
.validation-title { font-size: var(--font-size-lg); font-weight: 600; color: var(--text-primary); margin-bottom: 8px; }
.validation-sub { font-size: var(--font-size-sm); color: var(--text-secondary); }
/* ─── Dashboard (checklist layout — reuses split-container) ─── */
.dash-step-count { font-size: var(--font-size-sm); font-weight: 500; color: var(--text-secondary); margin-bottom: 24px; }
.dash-step-count strong { color: var(--text-primary); font-weight: 700; }
.dash-section-label { font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-tertiary); margin-bottom: 12px; margin-top: 28px; }
.dash-section-label:first-child { margin-top: 0; }
.checklist-card { padding: 16px 20px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface); cursor: pointer; transition: all var(--transition-fast); margin-bottom: 10px; }
.checklist-card:hover { border-color: var(--color-gray-400); box-shadow: var(--shadow-xs); }
.checklist-card.complete { border-color: var(--color-green-100); background: var(--color-green-50); }
.checklist-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.checklist-card-title { font-size: 15px; font-weight: 600; color: var(--text-primary); }
.checklist-card-action { font-size: 12px; font-weight: 600; color: var(--text-tertiary); display: flex; align-items: center; gap: 4px; }
.checklist-card:hover .checklist-card-action { color: var(--text-primary); }
.checklist-card.complete .checklist-card-action { color: var(--color-green-600); }
.checklist-req { display: flex; align-items: center; gap: 10px; padding: 5px 0; font-size: 13px; }
.checklist-req-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--color-gray-300); flex-shrink: 0; }
.checklist-req-dot.active { background: var(--color-green-500); }
.checklist-req-dot.pending { background: var(--warn); }
.checklist-req-label { color: var(--text-secondary); min-width: 110px; }
.checklist-req-provider { color: var(--text-tertiary); font-size: 12px; }
.checklist-req-provider.connected { color: var(--text-secondary); }
.back-btn { display: inline-flex; align-items: center; gap: 6px; font-size: var(--font-size-sm); font-weight: 500; color: var(--text-secondary); cursor: pointer; border: none; background: none; padding: 0; margin-bottom: 24px; transition: color var(--transition-fast); }
.back-btn:hover { color: var(--text-primary); }
</style>
</head>

<div id="app"></div>
<script>
// ═══════════════════════════════════════════
// DATA MODEL — Mid-Size B2C Stack
// ═══════════════════════════════════════════
const MINIMUM_REQUIREMENTS = [
  { key: 'write:email', label: 'Email Delivery' },
  { key: 'write:sms', label: 'SMS / OTP' },
  { key: 'write:push', label: 'Mobile Push' },
  { key: 'read:transactions', label: 'Transaction Ledger' },
];
const OPTIONAL_REQUIREMENTS = [
  { key: 'read:support_tickets', label: 'Support History' },
  { key: 'read:customer_ratings', label: 'NPS / Sentiment' },
];
const INTEGRATION_CATALOG = {
  // ── TIER 1: PRIMARY CRM HUBS ──
  Salesforce: { category: 'CRM', color: '#00A1E0', capabilities: ['write:email', 'write:sms', 'write:push'], scopeDescriptions: { 'write:email': 'Email delivery', 'write:sms': 'SMS delivery', 'write:push': 'Push notifications' } },
  Braze: { category: 'CRM', color: '#ED5C2B', capabilities: ['write:email', 'write:sms', 'write:push'], scopeDescriptions: { 'write:email': 'Email delivery', 'write:sms': 'SMS delivery', 'write:push': 'Push notifications' } },
  Klaviyo: { category: 'CRM', color: '#000000', capabilities: ['write:email', 'write:sms', 'write:push'], scopeDescriptions: { 'write:email': 'Email delivery', 'write:sms': 'SMS delivery', 'write:push': 'Push notifications' } },
  'Customer.io': { category: 'CRM', color: '#1B9AAA', capabilities: ['write:email', 'write:sms', 'write:push'], scopeDescriptions: { 'write:email': 'Email delivery', 'write:sms': 'SMS delivery', 'write:push': 'Push notifications' } },
  Iterable: { category: 'CRM', color: '#6032D6', capabilities: ['write:email', 'write:sms', 'write:push'], scopeDescriptions: { 'write:email': 'Email delivery', 'write:sms': 'SMS delivery', 'write:push': 'Push notifications' } },
  // Realistic limitations: ActiveCampaign lacks Push. HubSpot & Mailchimp lack native SMS/Push.
  ActiveCampaign: { category: 'CRM', color: '#356AE6', capabilities: ['write:email', 'write:sms'], scopeDescriptions: { 'write:email': 'Email delivery', 'write:sms': 'SMS delivery' } },

  if (needsEmail && needsSMS && needsPush) {

      sub: 'All customer communications are delivered through your own channels: email, SMS and push notification.',
      category: 'Comms',
      unmetLabel: 'Communication Hub',

  }

  const channelMap = {

    if (unmetKeys.includes(key)) {

        .filter(([_, v]) => area.categories.includes(v.category))
        .map(([name]) => name)
        .filter(name => !state.connectedPlatforms.includes(name));
      available.forEach(name => { grid += platformRow(name); });
    }
    gridContent = grid ? `<div class="platform-grid">${grid}</div>` : '';
  }

  const optionalBadge = !area.required ? '<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;"><span style="font-size:11px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;color:var(--text-tertiary);background:var(--color-gray-100);padding:2px 8px;border-radius:var(--radius-full);">Optional</span></div>' : '';

  // No explicit requirement rows — dynamic grid communicates gaps implicitly

  // Continue button — advances to next area
  const areaKeys = Object.keys(SETUP_AREAS);
  const currentIndex = areaKeys.indexOf(state.activeSetupArea);
  const isLast = currentIndex === areaKeys.length - 1;
  const continueLabel = isLast ? 'Finish Setup' : 'Continue';
  const continueAction = isLast ? "alert('Exiting setup flow')" : "goToNextArea()";

  return `
    <div class="prompt-card animate">
      ${optionalBadge}
      <div class="prompt-question">${area.question}</div>
      <div class="prompt-sub">${area.sub}</div>
      ${gridContent}
    </div>
    <button class="cta-btn" style="margin-top:32px;" onclick="${continueAction}">${continueLabel}</button>
  `;
}

// ─── Unified view: sidebar + content (always) ───
function renderUnifiedView() {
  return `
    <div class="split-container">
      <div class="left-col">${renderSidebar()}</div>
      <div class="right-col${state.justConnected ? ' animate-in' : ''}">${renderAreaContent()}</div>
    </div>
  `;
}

// MODAL (independent of main render)
// ═══════════════════════════════════════════
function updateModal() {
  const container = document.getElementById('modal-container');
  if (!container) return;
  container.innerHTML = state.modal ? renderModal() : '';
}
// ═══════════════════════════════════════════
// EVENT HANDLERS
// ═══════════════════════════════════════════
window.showPreAuth = function(name) {
  const platform = INTEGRATION_CATALOG[name];
  const modalType = platform?.modalType || 'oauth';
  if (modalType === 'webhooks') {
    state.modal = { type: 'webhooks', platform: name };
  } else if (modalType === 'api') {
    state.modal = { type: 'api', platform: name };
  } else if (modalType === 'filedrop') {
    state.modal = { type: 'filedrop', platform: name };
  } else {
    state.modal = { type: 'preauth', platform: name };
  }
  updateModal();
};
window.closeModal = function() {
  state.modal = null;
  updateModal();
};
// ═══════════════════════════════════════════
// AGENTIC BUILDER HANDLERS (demo simulation)
// ═══════════════════════════════════════════
window.generateWebhookMapping = function() {
  const input = document.getElementById('agentic-webhook-input');
  const output = document.getElementById('agentic-webhook-output');
  if (!input || !output || !input.value.trim()) return;
  const btn = input.nextElementSibling;
  btn.disabled = true;
  btn.textContent = 'Mapping...';
  setTimeout(() => {
    output.innerHTML = `<div class="agentic-output">✓ Field mapping complete

  Your payload              →  Edoo schema
  ─────────────────────────────────────────
  data.id                   →  transaction_id
  data.amount (÷ 100)       →  amount
  data.currency             →  currency
  data.customer             →  customer_external_id
  event (charge.succeeded)  →  event_type: "purchase"
  (auto-generated)          →  timestamp: ISO 8601

Ready to receive events at your endpoint.</div>`;
    btn.textContent = 'Map Fields';
    btn.disabled = false;
  }, 900);
};
window.generateAPIScript = function() {
  const input = document.getElementById('agentic-api-input');
  const output = document.getElementById('agentic-api-output');
  if (!input || !output || !input.value.trim()) return;
  const btn = input.nextElementSibling;
  btn.disabled = true;
  btn.textContent = 'Generating...';
  setTimeout(() => {
    output.innerHTML = `<div class="agentic-output">import requests

EDOO_API_KEY = "edoo_live_*******************"
EDOO_ENDPOINT = "https://api.edoo.ai/v1/transactions"

def send_transaction(row):
    payload = {
        "transaction_id": row["user_account_id"],
        "amount": float(row["usd_amount"]),
        "currency": "USD",
        "event_type": row["event_type"],
        "timestamp": row["created_at"],
    }
    resp = requests.post(

  const input = document.getElementById('agentic-file-input');

  Your column       Type       →  Edoo field

against this mapping automatically.</div>`;

window.initiateOAuth = function(name) {
  state.modal = { type: 'validating', platform: name };
  updateModal();
  setTimeout(() => completeConnection(name), 1200);
};
function completeConnection(name) {
  connectPlatform(name);
  state.modal = null;
  state.justConnected = name;
  render();
  setTimeout(() => {
    state.justConnected = null;
    const landedCard = document.querySelector('.ledger-card.just-landed');
    if (landedCard) landedCard.classList.remove('just-landed');
  }, 2000);
}
function triggerExitTransition() {
  const container = document.querySelector('.split-container');
  const leftCol = document.querySelector('.left-col');
  const rightCol = document.querySelector('.right-col');
  if (!container || !rightCol) return;
  // Step 1: Fade out left column
  if (leftCol) leftCol.style.opacity = '0';
  // Step 2: After left fades, expand right panel
  setTimeout(() => {
    container.classList.add('takeover');
    // Step 3: Add CTA after expansion settles
    setTimeout(() => {
      const ctaDiv = document.createElement('div');
      ctaDiv.className = 'exit-cta';
      ctaDiv.innerHTML = `<button class="cta-btn" onclick="alert('Navigating to Screen 3: Strategy Builder')">Generate Referral Strategy</button>`;
      rightCol.appendChild(ctaDiv);
      // Trigger fade-in on next frame
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          ctaDiv.classList.add('visible');
        });
      });
    }, 500);
  }, 300);
}
window.toggleKebab = function(name, event) {
  event.stopPropagation();
  // Close any open kebab first
  document.querySelectorAll('.ledger-dropdown').forEach(el => el.remove());
  if (state.openKebab === name) {
    state.openKebab = null;
    return;
  }
  state.openKebab = name;
  const kebabEl = event.currentTarget;
  const dropdown = document.createElement('div');
  dropdown.className = 'ledger-dropdown';
  dropdown.innerHTML = `<button class="ledger-dropdown-item" onclick="doDisconnect('${name}')"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M9 3L3 9M3 3l6 6" stroke="var(--danger)" stroke-width="1.3" stroke-linecap="round"/></svg>Disconnect</button>`;
  kebabEl.appendChild(dropdown);
};
window.doDisconnect = function(name) {
  event.stopPropagation();
  state.openKebab = null;
  disconnectPlatform(name);
  render();
};
window.skipSupport = function() {
  state.supportSkipped = true;
  goToDashboard();
};
window.skipNPS = function() {
  state.npsSkipped = true;
  goToDashboard();
};
window.goToSetup = function(areaId) {
  state.activeSetupArea = areaId;
  state.justConnected = null;
  render();
};
window.goToNextArea = function() {
  const areaKeys = Object.keys(SETUP_AREAS);
  const currentIndex = areaKeys.indexOf(state.activeSetupArea);
  if (currentIndex < areaKeys.length - 1) {
    state.activeSetupArea = areaKeys[currentIndex + 1];
    state.justConnected = null;
    render();
  } else {
    alert('Exiting setup flow');
  }
};
window.goToDashboard = function() {
  state.activeSetupArea = null;
  state.justConnected = null;
  render();
};
// ═══════════════════════════════════════════
// STATE JUMP BUTTONS
// ═══════════════════════════════════════════
window.jumpToState = function(preset) {
  state = { view: 'dashboard', activeSetupArea: null, fulfilledCapabilities: [], connectedPlatforms: [], modal: null, supportSkipped: false, npsSkipped: false, openKebab: null, lastPhase: null, justConnected: null, exitTransitioning: false, commsExpanded: false, dataExpanded: false };
  switch (preset) {
    case 'empty':
      break;
    case 'after_voice':
    case 'after_comms':
      connectPlatform('Braze');
      break;
    case 'after_truth':
    case 'after_data':
      connectPlatform('Braze');
      connectPlatform('Shopify');
      break;
    case 'optional_support':
      connectPlatform('Braze');
      connectPlatform('Shopify');
      connectPlatform('Zendesk');
      break;
    case 'optional_nps':
    case 'complete':
      connectPlatform('Braze');
      connectPlatform('Shopify');
      connectPlatform('Zendesk');
      connectPlatform('SurveyMonkey');
      break;
    case 'multi':
      // Demo 1:many — multiple providers per capability
      connectPlatform('Braze');
      connectPlatform('SendGrid');
      connectPlatform('Shopify');
      connectPlatform('Inbound Webhooks');
      break;
  }
  render();
  if (false) {
  }
};
// Close kebab on outside click
document.addEventListener('click', () => {
  if (state.openKebab) {
    state.openKebab = null;
    document.querySelectorAll('.ledger-dropdown').forEach(el => el.remove());
  }
});
// Initial render
render();
