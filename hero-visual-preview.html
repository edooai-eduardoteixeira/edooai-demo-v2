<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hero Visual Preview — Referral Network</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #FAF7F2;
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 80px 48px;
  }

  .hero-layout {
    max-width: 1100px;
    width: 100%;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 64px;
  }

  .hero-text {
    max-width: 520px;
    padding-top: 40px;
  }
  .hero-text h1 {
    font-family: 'Playfair Display', serif;
    font-size: 56px;
    font-weight: 700;
    color: #66001F;
    line-height: 1.08;
    letter-spacing: -0.02em;
    margin-bottom: 32px;
  }
  .hero-text p {
    font-size: 22px;
    font-weight: 500;
    color: #6B5E54;
    line-height: 1.5;
    margin-bottom: 40px;
  }
  .hero-text button {
    background: #66001F;
    color: white;
    border: none;
    padding: 14px 32px;
    font-size: 16px;
    font-weight: 600;
    border-radius: 10px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
  }

  .hero-visual {
    flex-shrink: 0;
    width: 380px;
    height: 360px;
    padding-top: 10px;
    position: relative;
  }

  .network-svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 380px;
    height: 360px;
    overflow: visible;
  }

  .net-line {
    stroke: #E4DDD5;
    stroke-width: 1.5;
    opacity: 0;
  }

  .net-node {
    opacity: 0;
  }
</style>
</head>
<body>

<div class="hero-layout">
  <div class="hero-text">
    <h1>Turn your best customers into your growth engine.</h1>
    <p>Stop competing for expensive ads while your most powerful channel is untapped. We operate your referrals end-to-end to deliver active customers at a fraction of your CAC.</p>
    <button>Start Now</button>
  </div>

  <div class="hero-visual">
    <svg class="network-svg" viewBox="0 0 380 360">
      <!-- Lines drawn by JS -->
      <g id="linesGroup"></g>
      <!-- Nodes drawn by JS -->
      <g id="nodesGroup"></g>
    </svg>
  </div>
</div>

<script>
  var network = [
    // Seeds — existing customers (dark brown)
    { id: 0, x: 80,  y: 140, r: 8,   type: 'seed', parent: null },
    { id: 1, x: 200, y: 100, r: 7,   type: 'seed', parent: null },
    { id: 2, x: 160, y: 240, r: 7.5, type: 'seed', parent: null },

    // Wave 1 — referred by seeds
    { id: 3, x: 40,  y: 70,  r: 6, parent: 0 },
    { id: 4, x: 135, y: 55,  r: 5.5, parent: 1 },
    { id: 5, x: 280, y: 80,  r: 6.5, parent: 1 },
    { id: 6, x: 100, y: 280, r: 6, parent: 2 },
    { id: 7, x: 240, y: 210, r: 5.5, parent: 2 },

    // Wave 2 — compounding
    { id: 8,  x: 15,  y: 170, r: 5, parent: 3 },
    { id: 9,  x: 310, y: 150, r: 6, parent: 5 },
    { id: 10, x: 55,  y: 320, r: 5.5, parent: 6 },
    { id: 11, x: 300, y: 265, r: 5, parent: 7 },
    { id: 12, x: 175, y: 28,  r: 5, parent: 4 },

    // Wave 3 — further compounding
    { id: 13, x: 350, y: 110, r: 5, parent: 9 },
    { id: 14, x: 345, y: 225, r: 4.5, parent: 11 },
    { id: 15, x: 115, y: 340, r: 5, parent: 10 },
    { id: 16, x: 248, y: 28,  r: 4.5, parent: 12 },
  ];

  var linesGroup = document.getElementById('linesGroup');
  var nodesGroup = document.getElementById('nodesGroup');

  var lineEls = {};
  var nodeEls = {};

  // Build SVG elements
  network.forEach(function(n) {
    // Line to parent
    if (n.parent !== null) {
      var p = network[n.parent];
      var line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', p.x);
      line.setAttribute('y1', p.y);
      line.setAttribute('x2', n.x);
      line.setAttribute('y2', n.y);
      line.setAttribute('class', 'net-line');
      linesGroup.appendChild(line);
      lineEls[n.id] = line;
    }

    // Node circle
    var circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    circle.setAttribute('cx', n.x);
    circle.setAttribute('cy', n.y);
    circle.setAttribute('r', n.r);
    circle.setAttribute('class', 'net-node');

    if (n.type === 'seed') {
      circle.setAttribute('fill', '#2C2320');
      circle.setAttribute('stroke', 'none');
    } else {
      circle.setAttribute('fill', 'transparent');
      circle.setAttribute('stroke', '#D1C8BE');
      circle.setAttribute('stroke-width', '2');
    }

    nodesGroup.appendChild(circle);
    nodeEls[n.id] = circle;
  });

  // Animation timeline
  function animate(el, props, duration) {
    var start = performance.now();
    var initial = {};
    Object.keys(props).forEach(function(k) {
      initial[k] = parseFloat(el.style[k]) || 0;
    });

    function step(now) {
      var t = Math.min((now - start) / duration, 1);
      // ease-out cubic
      var ease = 1 - Math.pow(1 - t, 3);
      Object.keys(props).forEach(function(k) {
        el.style[k] = initial[k] + (props[k] - initial[k]) * ease;
      });
      if (t < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function showNode(id, asSeed) {
    var el = nodeEls[id];
    el.style.opacity = 0;
    el.style.transform = 'scale(0)';
    el.style.transformOrigin = 'center';
    el.style.transformBox = 'fill-box';

    // Fade + scale in
    var startTime = performance.now();
    function step(now) {
      var t = Math.min((now - startTime) / 400, 1);
      var ease = 1 - Math.pow(1 - t, 3);
      el.style.opacity = ease;
      // Use SVG transform for scaling
      var n = network[id];
      var s = ease;
      el.setAttribute('transform', 'translate(' + n.x + ',' + n.y + ') scale(' + s + ') translate(' + (-n.x) + ',' + (-n.y) + ')');
      if (t < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function showLine(id) {
    var el = lineEls[id];
    if (!el) return;
    var startTime = performance.now();
    function step(now) {
      var t = Math.min((now - startTime) / 500, 1);
      el.style.opacity = t;
      if (t < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function activateNode(id) {
    var el = nodeEls[id];
    var n = network[id];
    // Transition from outline to filled brand
    var startTime = performance.now();
    function step(now) {
      var t = Math.min((now - startTime) / 500, 1);
      var ease = 1 - Math.pow(1 - t, 3);

      // Interpolate color: transparent -> #66001F
      var r = Math.round(102 * ease);
      var g = Math.round(0 * ease);
      var b = Math.round(31 * ease);
      el.setAttribute('fill', 'rgb(' + r + ',' + g + ',' + b + ')');
      el.setAttribute('stroke', 'rgb(' + r + ',' + g + ',' + b + ')');

      if (t < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function runCycle() {
    // Reset all
    network.forEach(function(n) {
      var el = nodeEls[n.id];
      el.style.opacity = 0;
      el.setAttribute('transform', '');
      if (n.type === 'seed') {
        el.setAttribute('fill', '#2C2320');
        el.setAttribute('stroke', 'none');
      } else {
        el.setAttribute('fill', 'transparent');
        el.setAttribute('stroke', '#D1C8BE');
        el.setAttribute('stroke-width', '2');
      }
      if (lineEls[n.id]) {
        lineEls[n.id].style.opacity = 0;
      }
    });

    var delay = 0;

    // Seeds appear
    [0, 1, 2].forEach(function(id, i) {
      setTimeout(function() { showNode(id); }, delay + i * 200);
    });
    delay += 800;

    // Wave 1: pending then activate
    [3, 4, 5, 6, 7].forEach(function(id, i) {
      var t = delay + i * 300;
      setTimeout(function() { showLine(id); showNode(id); }, t);
      setTimeout(function() { activateNode(id); }, t + 600);
    });
    delay += 5 * 300 + 800;

    // Wave 2
    [8, 9, 10, 11, 12].forEach(function(id, i) {
      var t = delay + i * 300;
      setTimeout(function() { showLine(id); showNode(id); }, t);
      setTimeout(function() { activateNode(id); }, t + 600);
    });
    delay += 5 * 300 + 800;

    // Wave 3
    [13, 14, 15, 16].forEach(function(id, i) {
      var t = delay + i * 250;
      setTimeout(function() { showLine(id); showNode(id); }, t);
      setTimeout(function() { activateNode(id); }, t + 500);
    });
    delay += 4 * 250 + 2500;

    // Loop
    setTimeout(runCycle, delay);
  }

  // Start
  setTimeout(runCycle, 500);
</script>

</body>
</html>
