<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hero Visual Preview — Referral Network</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #FAF7F2;
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 80px 48px;
  }

  .hero-layout {
    max-width: 1100px;
    width: 100%;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 64px;
  }

  .hero-text {
    max-width: 520px;
    padding-top: 40px;
  }
  .hero-text h1 {
    font-family: 'Playfair Display', serif;
    font-size: 56px;
    font-weight: 700;
    color: #66001F;
    line-height: 1.08;
    letter-spacing: -0.02em;
    margin-bottom: 32px;
  }
  .hero-text p {
    font-size: 22px;
    font-weight: 500;
    color: #6B5E54;
    line-height: 1.5;
    margin-bottom: 40px;
  }
  .hero-text button {
    background: #66001F;
    color: white;
    border: none;
    padding: 14px 32px;
    font-size: 16px;
    font-weight: 600;
    border-radius: 10px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
  }

  /* Right side — the network visual */
  .hero-visual {
    flex-shrink: 0;
    width: 380px;
    height: 360px;
    padding-top: 10px;
    position: relative;
  }

  /* SVG lines connecting nodes */
  .network-lines {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .network-line {
    stroke: #E4DDD5;
    stroke-width: 1.5;
    opacity: 0;
    transition: opacity 0.6s ease-out;
  }
  .network-line.visible {
    opacity: 1;
  }

  /* Node: a person in the network */
  .node {
    position: absolute;
    border-radius: 50%;
    opacity: 0;
    transform: scale(0);
    transition: opacity 0.5s ease-out, transform 0.5s ease-out, background 0.5s ease-out, border-color 0.4s ease-out, box-shadow 0.4s ease-out;
  }

  /* Outline = referred but not yet active */
  .node.pending {
    opacity: 1;
    transform: scale(1);
    background: transparent;
    border: 2px solid #D1C8BE;
  }

  /* Solid = active customer */
  .node.active {
    opacity: 1;
    transform: scale(1);
    background: #66001F;
    border: 2px solid #66001F;
    box-shadow: 0 0 0 4px rgba(102, 0, 31, 0.1);
  }

  /* Seed nodes — the "existing customers" — slightly different */
  .node.seed {
    opacity: 1;
    transform: scale(1);
    background: #2C2320;
    border: 2px solid #2C2320;
  }
</style>
</head>
<body>

<div class="hero-layout">
  <div class="hero-text">
    <h1>Turn your best customers into your growth engine.</h1>
    <p>Stop competing for expensive ads while your most powerful channel is untapped. We operate your referrals end‑to‑end to deliver active customers at a fraction of your CAC.</p>
    <button>Start Now</button>
  </div>

  <div class="hero-visual" id="visual">
    <svg class="network-lines" id="lines"></svg>
  </div>
</div>

<script>
  /*
    The network:
    - Seed nodes (dark, existing customers) are already present
    - New nodes appear as outlines (pending referrals), connected to a seed/active node
    - Outlines fill in with brand color (become active customers)
    - Those new active nodes then spawn their own referrals
    - The network grows organically — customers creating customers
  */

  const visual = document.getElementById('visual');
  const linesSvg = document.getElementById('lines');

  // Network structure: each node has position, size, and parent (who referred them)
  // Seeds have no parent. All others grow from existing nodes.
  const network = [
    // === SEEDS (existing customers — dark, appear immediately) ===
    { id: 0, x: 80,  y: 140, size: 16, type: 'seed', parent: null },
    { id: 1, x: 200, y: 100, size: 14, type: 'seed', parent: null },
    { id: 2, x: 160, y: 240, size: 15, type: 'seed', parent: null },

    // === WAVE 1: referred by seeds ===
    { id: 3, x: 40,  y: 70,  size: 12, type: 'referred', parent: 0 },
    { id: 4, x: 135, y: 60,  size: 11, type: 'referred', parent: 1 },
    { id: 5, x: 280, y: 80,  size: 13, type: 'referred', parent: 1 },
    { id: 6, x: 100, y: 260, size: 12, type: 'referred', parent: 2 },
    { id: 7, x: 240, y: 200, size: 11, type: 'referred', parent: 2 },

    // === WAVE 2: referred by wave 1 (compounding) ===
    { id: 8,  x: 15,  y: 170, size: 10, type: 'referred', parent: 3 },
    { id: 9,  x: 310, y: 150, size: 12, type: 'referred', parent: 5 },
    { id: 10, x: 60,  y: 310, size: 11, type: 'referred', parent: 6 },
    { id: 11, x: 300, y: 260, size: 10, type: 'referred', parent: 7 },
    { id: 12, x: 180, y: 30,  size: 10, type: 'referred', parent: 4 },

    // === WAVE 3: further compounding ===
    { id: 13, x: 350, y: 110, size: 10, type: 'referred', parent: 9 },
    { id: 14, x: 340, y: 220, size: 9,  type: 'referred', parent: 11 },
    { id: 15, x: 120, y: 330, size: 10, type: 'referred', parent: 10 },
    { id: 16, x: 250, y: 30,  size: 9,  type: 'referred', parent: 12 },
  ];

  // Create DOM elements for nodes
  const nodeEls = {};
  const lineEls = {};

  network.forEach(n => {
    const el = document.createElement('div');
    el.className = 'node';
    el.style.left = (n.x - n.size / 2) + 'px';
    el.style.top = (n.y - n.size / 2) + 'px';
    el.style.width = n.size + 'px';
    el.style.height = n.size + 'px';
    visual.appendChild(el);
    nodeEls[n.id] = el;

    // Create connecting line to parent
    if (n.parent !== null) {
      const parent = network[n.parent];
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', parent.x);
      line.setAttribute('y1', parent.y);
      line.setAttribute('x2', n.x);
      line.setAttribute('y2', n.y);
      line.classList.add('network-line');
      linesSvg.appendChild(line);
      lineEls[n.id] = line;
    }
  });

  // Animation sequence
  const timeline = [];
  let time = 0;

  // Step 1: Seeds appear (already active)
  network.filter(n => n.type === 'seed').forEach((n, i) => {
    timeline.push({ time: time + i * 200, id: n.id, action: 'seed' });
  });
  time += 800;

  // Step 2: Wave 1 — appear as pending (outline), then activate
  const wave1 = network.filter(n => n.parent !== null && n.parent <= 2);
  wave1.forEach((n, i) => {
    timeline.push({ time: time + i * 300, id: n.id, action: 'pending' });
    timeline.push({ time: time + i * 300 + 600, id: n.id, action: 'activate' });
  });
  time += wave1.length * 300 + 800;

  // Step 3: Wave 2 — compounding
  const wave2 = network.filter(n => [3,4,5,6,7].includes(n.parent));
  wave2.forEach((n, i) => {
    timeline.push({ time: time + i * 300, id: n.id, action: 'pending' });
    timeline.push({ time: time + i * 300 + 600, id: n.id, action: 'activate' });
  });
  time += wave2.length * 300 + 800;

  // Step 4: Wave 3 — further compounding
  const wave3 = network.filter(n => [9,10,11,12].includes(n.parent));
  wave3.forEach((n, i) => {
    timeline.push({ time: time + i * 250, id: n.id, action: 'pending' });
    timeline.push({ time: time + i * 250 + 500, id: n.id, action: 'activate' });
  });
  time += wave3.length * 250 + 2000;

  // Reset time
  const totalDuration = time;

  function runTimeline() {
    // Reset everything
    Object.values(nodeEls).forEach(el => {
      el.className = 'node';
      el.style.opacity = '0';
      el.style.transform = 'scale(0)';
    });
    Object.values(lineEls).forEach(el => {
      el.classList.remove('visible');
    });

    // Schedule each event
    timeline.forEach(event => {
      setTimeout(() => {
        const el = nodeEls[event.id];
        if (event.action === 'seed') {
          el.className = 'node seed';
        } else if (event.action === 'pending') {
          el.className = 'node pending';
          // Show connecting line
          if (lineEls[event.id]) {
            lineEls[event.id].classList.add('visible');
          }
        } else if (event.action === 'activate') {
          el.className = 'node active';
        }
      }, event.time);
    });

    // Loop
    setTimeout(runTimeline, totalDuration);
  }

  // Start
  setTimeout(runTimeline, 400);
</script>

</body>
</html>
