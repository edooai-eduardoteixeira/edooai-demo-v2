<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hero Visual Preview</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #FAF7F2;
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 80px 48px;
  }

  .hero-layout {
    max-width: 1100px;
    width: 100%;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 64px;
  }

  .hero-text {
    max-width: 520px;
    padding-top: 40px;
  }
  .hero-text h1 {
    font-family: 'Playfair Display', serif;
    font-size: 56px;
    font-weight: 700;
    color: #66001F;
    line-height: 1.08;
    letter-spacing: -0.02em;
    margin-bottom: 32px;
  }
  .hero-text p {
    font-size: 22px;
    font-weight: 500;
    color: #6B5E54;
    line-height: 1.5;
    margin-bottom: 40px;
  }
  .hero-text button {
    background: #66001F;
    color: white;
    border: none;
    padding: 14px 32px;
    font-size: 16px;
    font-weight: 600;
    border-radius: 10px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
  }

  /* ===== THE VISUAL — pure CSS, no JS ===== */

  .hero-visual {
    flex-shrink: 0;
    width: 380px;
    height: 380px;
    position: relative;
  }

  /* Dots — HTML divs, absolutely positioned */
  .dot {
    position: absolute;
    border-radius: 50%;
    opacity: 0;
    transform: scale(0);
  }

  /* Lines — thin divs rotated into position */
  .line {
    position: absolute;
    height: 1.5px;
    background: #E4DDD5;
    transform-origin: 0 50%;
    opacity: 0;
  }

  /* === SEED animation: appear as dark solid === */
  @keyframes seed-in {
    0%   { opacity: 0; transform: scale(0); }
    100% { opacity: 1; transform: scale(1); }
  }

  /* === REFERRED animation: appear as outline, then fill with brand === */
  @keyframes referred-in {
    0%   { opacity: 0; transform: scale(0); background: transparent; border-color: #D1C8BE; box-shadow: none; }
    30%  { opacity: 1; transform: scale(1); background: transparent; border-color: #D1C8BE; box-shadow: none; }
    100% { opacity: 1; transform: scale(1); background: #66001F; border-color: #66001F; box-shadow: 0 0 0 4px rgba(102,0,31,0.12); }
  }

  /* === LINE animation: fade in === */
  @keyframes line-in {
    0%   { opacity: 0; }
    100% { opacity: 1; }
  }

  /* Total cycle: ~10s animation + hold, then repeats */

  /* --- Seeds (appear 0s–0.6s) --- */
  .seed { background: #2C2320; animation: seed-in 0.4s ease-out forwards; }
  .s0 { left: 72px; top: 132px; width: 16px; height: 16px; animation-delay: 0s; }
  .s1 { left: 193px; top: 93px; width: 14px; height: 14px; animation-delay: 0.2s; }
  .s2 { left: 153px; top: 233px; width: 15px; height: 15px; animation-delay: 0.4s; }

  /* --- Wave 1 (1s–3.5s) — referred by seeds --- */
  .referred { border: 2px solid #D1C8BE; animation: referred-in 1.2s ease-out forwards; }
  .r3  { left: 34px;  top: 64px;  width: 12px; height: 12px; animation-delay: 1.0s; }
  .r4  { left: 129px; top: 49px;  width: 11px; height: 11px; animation-delay: 1.3s; }
  .r5  { left: 274px; top: 74px;  width: 13px; height: 13px; animation-delay: 1.6s; }
  .r6  { left: 94px;  top: 274px; width: 12px; height: 12px; animation-delay: 1.9s; }
  .r7  { left: 234px; top: 204px; width: 11px; height: 11px; animation-delay: 2.2s; }

  /* --- Wave 2 (3.5s–5.5s) — compounding --- */
  .r8  { left: 9px;   top: 164px; width: 10px; height: 10px; animation-delay: 3.5s; }
  .r9  { left: 304px; top: 144px; width: 12px; height: 12px; animation-delay: 3.8s; }
  .r10 { left: 49px;  top: 314px; width: 11px; height: 11px; animation-delay: 4.1s; }
  .r11 { left: 294px; top: 259px; width: 10px; height: 10px; animation-delay: 4.4s; }
  .r12 { left: 169px; top: 22px;  width: 10px; height: 10px; animation-delay: 4.7s; }

  /* --- Wave 3 (5.5s–7s) — further compounding --- */
  .r13 { left: 344px; top: 104px; width: 10px; height: 10px; animation-delay: 5.8s; }
  .r14 { left: 339px; top: 219px; width: 9px;  height: 9px;  animation-delay: 6.1s; }
  .r15 { left: 109px; top: 334px; width: 10px; height: 10px; animation-delay: 6.4s; }
  .r16 { left: 242px; top: 22px;  width: 9px;  height: 9px;  animation-delay: 6.7s; }

  /* --- Lines (appear just before their target node) --- */
  .line { animation: line-in 0.4s ease-out forwards; }

  /* Wave 1 lines */
  .l3  { animation-delay: 0.9s; }
  .l4  { animation-delay: 1.2s; }
  .l5  { animation-delay: 1.5s; }
  .l6  { animation-delay: 1.8s; }
  .l7  { animation-delay: 2.1s; }
  /* Wave 2 lines */
  .l8  { animation-delay: 3.4s; }
  .l9  { animation-delay: 3.7s; }
  .l10 { animation-delay: 4.0s; }
  .l11 { animation-delay: 4.3s; }
  .l12 { animation-delay: 4.6s; }
  /* Wave 3 lines */
  .l13 { animation-delay: 5.7s; }
  .l14 { animation-delay: 6.0s; }
  .l15 { animation-delay: 6.3s; }
  .l16 { animation-delay: 6.6s; }
</style>
</head>
<body>

<div class="hero-layout">
  <div class="hero-text">
    <h1>Turn your best customers into your growth engine.</h1>
    <p>Stop competing for expensive ads while your most powerful channel is untapped. We operate your referrals end-to-end to deliver active customers at a fraction of your CAC.</p>
    <button>Start Now</button>
  </div>

  <div class="hero-visual">
    <!-- Seeds (existing customers) -->
    <div class="dot seed s0"></div>
    <div class="dot seed s1"></div>
    <div class="dot seed s2"></div>

    <!-- Wave 1: referred by seeds -->
    <div class="dot referred r3"></div>
    <div class="dot referred r4"></div>
    <div class="dot referred r5"></div>
    <div class="dot referred r6"></div>
    <div class="dot referred r7"></div>

    <!-- Wave 2: compounding -->
    <div class="dot referred r8"></div>
    <div class="dot referred r9"></div>
    <div class="dot referred r10"></div>
    <div class="dot referred r11"></div>
    <div class="dot referred r12"></div>

    <!-- Wave 3: further compounding -->
    <div class="dot referred r13"></div>
    <div class="dot referred r14"></div>
    <div class="dot referred r15"></div>
    <div class="dot referred r16"></div>

    <!-- Connecting lines — SVG is simplest for lines between arbitrary points -->
    <svg style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;" viewBox="0 0 380 380">
      <!-- Wave 1: seed → referred -->
      <line class="line l3"  x1="80" y1="140" x2="40" y2="70"   stroke="#E4DDD5" stroke-width="1.5"/>
      <line class="line l4"  x1="200" y1="100" x2="135" y2="55" stroke="#E4DDD5" stroke-width="1.5"/>
      <line class="line l5"  x1="200" y1="100" x2="280" y2="80" stroke="#E4DDD5" stroke-width="1.5"/>
      <line class="line l6"  x1="160" y1="240" x2="100" y2="280" stroke="#E4DDD5" stroke-width="1.5"/>
      <line class="line l7"  x1="160" y1="240" x2="240" y2="210" stroke="#E4DDD5" stroke-width="1.5"/>
      <!-- Wave 2: wave1 → wave2 -->
      <line class="line l8"  x1="40" y1="70" x2="15" y2="170"   stroke="#E4DDD5" stroke-width="1.5"/>
      <line class="line l9"  x1="280" y1="80" x2="310" y2="150" stroke="#E4DDD5" stroke-width="1.5"/>
      <line class="line l10" x1="100" y1="280" x2="55" y2="320" stroke="#E4DDD5" stroke-width="1.5"/>
      <line class="line l11" x1="240" y1="210" x2="300" y2="265" stroke="#E4DDD5" stroke-width="1.5"/>
      <line class="line l12" x1="135" y1="55" x2="175" y2="28"  stroke="#E4DDD5" stroke-width="1.5"/>
      <!-- Wave 3: wave2 → wave3 -->
      <line class="line l13" x1="310" y1="150" x2="350" y2="110" stroke="#E4DDD5" stroke-width="1.5"/>
      <line class="line l14" x1="300" y1="265" x2="345" y2="225" stroke="#E4DDD5" stroke-width="1.5"/>
      <line class="line l15" x1="55" y1="320" x2="115" y2="340" stroke="#E4DDD5" stroke-width="1.5"/>
      <line class="line l16" x1="175" y1="28" x2="248" y2="28"  stroke="#E4DDD5" stroke-width="1.5"/>
    </svg>
  </div>
</div>

</body>
</html>
